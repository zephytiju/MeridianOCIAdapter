[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-storage-oci"
version = "1.1.0"
description = "OCI Distribution object adapter for Meridian"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "meridian-storage-core>=1.1,<2",
  "meridian-storage-object-common>=1.0.3,<2",
]

[project.optional-dependencies]
test = [
  "bandit[toml]==1.9.4",
  "build==1.6.0",
  "hatchling==1.32.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianOCIAdapter#readme"
Issues = "https://github.com/zephytiju/MeridianOCIAdapter/issues"
Repository = "https://github.com/zephytiju/MeridianOCIAdapter"

[project.entry-points."meridian_storage.adapters"]
oci-distribution = "meridian_storage.adapters.oci._factory:OciAdapterFactory"

[tool.hatch.build]
include = [
  "src/meridian_storage/adapters/oci/**/*.py",
  "src/meridian_storage/adapters/oci/py.typed",
  "src/meridian_storage/adapters/oci/compatibility.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=meridian_storage.adapters.oci",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
testpaths = ["tests"]
markers = [
  "integration: requires a genuine OCI Distribution endpoint",
  "owner_service: requires owner-managed registry credentials",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.adapters.oci"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
  "@overload",
  '\.\.\.',
]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage.adapters.oci"]
mypy_path = "src"
warn_unreachable = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PERF", "PT", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
